# Directories to scan for new audiobook files
source_dirs:
  - ~/Downloads
  # - /path/to/other/dir

# Destination root directory (Audiobookshelf-compatible)
# WSL path — adjust to match your NAS mount point
destination: "/mnt/audiobooks"

# File extensions to treat as audiobook archives
archive_extensions:
  - .zip
  - .rar
  - .7z

# File extensions to treat as audiobook audio
audio_extensions:
  - .m4b
  - .mp3
  - .m4a
  - .ogg
  - .opus
  - .flac
  - .wma
  - .aac

# File extensions to treat as ebook/companion files
companion_extensions:
  - .jpg
  - .jpeg
  - .png
  - .pdf
  - .epub
  - .nfo
  - .cue
  - .txt
  - .opf

# Auto-extract archives at destination (zip only; rar/7z are moved as-is)
auto_extract: true

# Delete archive after successful extraction
delete_after_extract: false

# Filename patterns to parse (tried in order, first match wins)
# Groups: author, title, series, sequence, year, narrator
filename_patterns:
  # N - Title - Author - Year  (e.g. "2 - Dune - Frank Herbert - 1965")
  - '(?P<sequence>\d+)\s*-\s*(?P<title>.+)\s*-\s*(?P<author>[^\d]+?)\s*-\s*(?P<year>\d{4})\s*$'
  # Author - Series Book N - Title (Year) [{Narrator}]  (float sequences like 0.2 supported)
  - '(?P<author>.+?) - (?P<series>.+?)\s*(?:Book|Vol\.?|Volume)\s*(?P<sequence>\d+(?:\.\d+)?)\s*-\s*(?P<title>.+?)(?:\s*\((?P<year>\d{4})\))?(?:\s*[\[{](?P<narrator>[^\]}]+)[\]}])?$'
  # Author - Title - Series, Book N [{Narrator}]  (e.g. "Title - Teixcalaan Series, Book 2")
  - '(?P<author>.+?) - (?P<title>.+?)\s+-\s+(?P<series>.+?),\s*(?:Book|Vol\.?|Volume)\s*(?P<sequence>\d+(?:\.\d+)?)(?:\s*[\[{](?P<narrator>[^\]}]+)[\]}])?$'
  # Author - Title (Year) [{Narrator}]
  - '(?P<author>.+?) - (?P<title>.+?)(?:\s*\((?P<year>\d{4})\))?(?:\s*[\[{](?P<narrator>[^\]}]+)[\]}])?$'
  # Title - Author (Year)
  - '(?P<title>.+?) - (?P<author>.+?)(?:\s*\((?P<year>\d{4})\))?$'
  # Series N Title  (e.g. "The Expanse 01 Leviathan Wakes", "The Expanse 02.5 Gods of Risk")
  # Requires 2+ words for the series name to avoid false matches like 'The 7 Habits'.
  - '(?P<series>(?:[^\W\d_]+\s+){2,}?)(?P<sequence>\d+(?:\.\d+)?)\s+(?P<title>.+?)(?:\s*\((?P<year>\d{4})\))?(?:\s*[\[{](?P<narrator>[^\]}]+)[\]}])?$'
  # Author_Title
  - '(?P<author>[^_]+)_(?P<title>.+)$'

# Preferred author name format for folder names:
#   last_first  → "Austen, Jane"  (library convention, default)
#   first_last  → "Jane Austen"   (natural reading order)
author_name_format: last_first

# Minimum file size to consider (bytes) — skip tiny files
min_file_size: 1048576  # 1 MB

# Move log file (for undo support)
move_log: "~/.aborg/moves.log"

# Optional: map single-word author names (case-insensitive) to their full names.
# Supplements the built-in table of classical/historical mononyms.
# known_authors:
#   "Proust": "Marcel Proust"
#   "Borges": "Jorge Luis Borges"

# ── Libby / OverDrive integration (requires odmpy) ─────────────────────
libby:
  # Folder to store Libby authentication tokens
  settings_folder: "~/.aborg/libby"

  # Merge downloaded MP3 parts into a single file
  merge: false

  # Merged file format (mp3 or m4b; m4b requires ffmpeg)
  merge_format: m4b

  # Embed chapter markers in downloaded files
  chapters: true

  # Download cover art (cover.jpg)
  keep_cover: true

  # Folder name format for downloaded books (odmpy format string)
  # Available: %(Title)s, %(Author)s, %(Series)s, %(ReadingOrder)s, %(Edition)s, %(ID)s
  book_folder_format: "%(Author)s - %(Title)s"
