# Source directories contain books to import.
source_dirs:
- ~/Downloads

# Set an existing destination directory for the collection.
destination: /mnt/audiobooks

# Use file extensions that start with a dot.
archive_extensions:
- .7z
- .rar
- .zip
audio_extensions:
- .aac
- .flac
- .m4a
- .m4b
- .mp3
- .ogg
- .opus
- .wma
companion_extensions:
- .cue
- .epub
- .jpeg
- .jpg
- .nfo
- .opf
- .pdf
- .png
- .txt

# Extract ZIP files. Copy or move other archives without extraction.
auto_extract: true

# Keep extracted source archives by default. The --copy option always keeps them.
delete_after_extract: false

# Use these regular expressions in order to read filename metadata.
filename_patterns:
- (?P<sequence>\d+)\s*-\s*(?P<title>.+)\s*-\s*(?P<author>[^\d]+?)\s*-\s*(?P<year>\d{4})\s*$
- (?P<author>.+?) - (?P<series>.+?)\s*(?:Book|Vol\.?|Volume)\s*(?P<sequence>\d+(?:\.\d+)?)\s*-\s*(?P<title>.+?)(?:\s*\((?P<year>\d{4})\))?(?:\s*[\[{](?P<narrator>[^\]}]+)[\]}])?$
- (?P<author>.+?) - (?P<title>.+?)\s+-\s+(?P<series>.+?),\s*(?:Book|Vol\.?|Volume)\s*(?P<sequence>\d+(?:\.\d+)?)(?:\s*[\[{](?P<narrator>[^\]}]+)[\]}])?$
- (?P<author>.+?) - (?P<title>.+?)(?:\s*\((?P<year>\d{4})\))?(?:\s*[\[{](?P<narrator>[^\]}]+)[\]}])?$
- (?P<title>.+?) - (?P<author>.+?)(?:\s*\((?P<year>\d{4})\))?$
- (?P<series>(?:[^\W\d_]+\s+){2,}?)(?P<sequence>\d+(?:\.\d+)?)\s+(?P<title>.+?)(?:\s*\((?P<year>\d{4})\))?(?:\s*[\[{](?P<narrator>[^\]}]+)[\]}])?$
- (?P<author>[^_]+)_(?P<title>.+)$

# Use last_first or first_last for author directory names.
author_name_format: last_first

# Set the minimum file size in bytes. Archives also have a 50,000,000-byte minimum.
min_file_size: 1048576

# The undo command reads this log file.
move_log: ~/.aborg/moves.log

# Map single-name aliases to full author names. Keys ignore letter case.
known_authors: {}

# Libby tools require the optional libby package extra.
libby:
  settings_folder: ~/.aborg/libby
  merge: false
  merge_format: m4b
  chapters: true
  keep_cover: true
  book_folder_format: '%(Author)s - %(Title)s'

# Set booleans to true or false without quotation marks.
# Use mp3 or m4b for merge_format. M4B needs ffmpeg.
# Protect settings_folder; it contains account data.
# Example alias: known_authors: {Proust: Marcel Proust}
